name: backend

# The backend orchestrates KYC, signs quotes and moves float. Each step here has
# a distinct meaning, and they are kept separate so a failure says which one:
#
#   prisma generate → the schema is valid and a client can be produced
#   typecheck       → the code agrees with its own types
#   lint            → type-aware rules (floating promises, untyped payloads)
#   test            → behaviour
#   build           → the production build actually compiles

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # The unit suite does not need a database — but this job runs it with one
      # available so a test that starts relying on the real schema fails here
      # rather than silently becoming an integration test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: remitbridge
          POSTGRES_PASSWORD: remitbridge
          POSTGRES_DB: remitbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remitbridge -d remitbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://remitbridge:remitbridge@localhost:5432/remitbridge?schema=public
      # Placeholders with the right *shape*. The schema is exercised, no network
      # is touched, and no real key is anywhere near CI.
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
      CONTRACT_ESCROW: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      CONTRACT_AGENT_REGISTRY: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      CONTRACT_COMPLIANCE_HOOK: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      CONTRACT_LIQUIDITY_POOL: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      ATTESTER_SECRET_KEY: SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      OPERATOR_SECRET_KEY: SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      TREASURY_PUBLIC_KEY: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      QUOTE_SIGNING_SECRET_KEY: SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The repository-root version file, not a per-package one: `node-version-file`
          # resolves from the workspace root, and a path inside `working-directory`
          # would silently not be found.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # Before typecheck: without a generated client every Prisma type degrades
      # to `any` and the typecheck passes for the wrong reason.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the schema applies cleanly
        run: npx prisma db push --skip-generate

  dependencies:
    name: dependency advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Blocking. A known-vulnerable dependency in a service that holds KYC
      # documents is a decision someone should have to make explicitly, and an
      # allowlist in the script is how that decision gets recorded.
      - name: Audit
        run: npm audit --audit-level=high
