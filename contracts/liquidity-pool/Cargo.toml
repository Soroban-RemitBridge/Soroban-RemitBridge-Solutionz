[package]
name = "liquidity-pool"
description = "Per-region float pool; agents draw stablecoin against their registry bond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
remit-interfaces = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Test-only: the pool's suite deploys the real registry so bond sufficiency is
# checked against real bonded collateral rather than a stub.
agent-registry = { workspace = true }
