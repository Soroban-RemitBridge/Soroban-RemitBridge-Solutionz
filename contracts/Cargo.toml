[workspace]
resolver = "2"
members = [
  "interfaces",
  "agent-registry",
  "compliance-hook",
  "remit-escrow",
  "liquidity-pool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "Apache-2.0"
repository = "https://github.com/Soroban-RemitBridge/Soroban-RemitBridge-Solutionz"
authors = ["RemitBridge Contributors"]
homepage = "https://github.com/Soroban-RemitBridge/Soroban-RemitBridge-Solutionz"
description = "Open, compliant last-mile remittance cash-out network on Stellar/Soroban"

[workspace.dependencies]
soroban-sdk = "22.0.1"
# Contracts depend on the interface crate, never on each other: see the crate
# docs in `interfaces/src/lib.rs` for why that distinction is load-bearing.
remit-interfaces = { path = "interfaces" }
# Test-only: the escrow's suite deploys the real registry and compliance hook so
# cross-contract behaviour is exercised end to end rather than mocked. These are
# `dev-dependencies`, so they are never linked into a contract's Wasm.
agent-registry = { path = "agent-registry" }
compliance-hook = { path = "compliance-hook" }

# Soroban contracts are deployed as Wasm and charged per byte of code size, so
# optimise for size (`opt-level = "z"`) while keeping `overflow-checks` on: an
# integer overflow in a value-moving contract must trap, never wrap.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.test]
opt-level = 1
